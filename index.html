<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台北垃圾車即時查詢</title>
  <meta name="description" content="找出你現在最快可以趕上的臺北市垃圾車停靠點，支援 GPS 定位與地址搜尋。">

  <!-- 鎖定 Leaflet 版本，避免哪天自動升級導致網站壞掉 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=140">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W784GKJ76H"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-W784GKJ76H");
  </script>
</head>

<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <h1>台北垃圾車即時查詢</h1>
        <p id="dataStatus">資料載入中...</p>
        <p>找出你現在最快可趕上的垃圾車清運點</p>

        <div class="mode-toggle" role="group" aria-label="前往方式">
          <button type="button" class="mode-btn" data-mode="walk" aria-pressed="true">🚶 步行</button>
          <button type="button" class="mode-btn" data-mode="ride" aria-pressed="false">🛵 騎車</button>
        </div>

        <button id="locateBtn" type="button">📍 使用我的位置</button>

        <div class="search-section">
          <label for="addressSearch">搜尋地址或地標</label>

          <div class="search-row">
            <input
              id="addressSearch"
              type="text"
              placeholder="台北車站、台北101、松山機場"
              autocomplete="off"
            />
            <button id="addressSearchBtn" type="button">搜尋</button>
          </div>

          <div id="message" class="search-message" aria-live="polite"></div>
        </div>
      </header>

      <section id="result">
        <p>請點「使用我的位置」或搜尋地址</p>
      </section>
    </aside>

    <main id="mapArea">
      <div id="map"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js?v=140"></script>
  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDHJ18rC0CuG4OGUbF-c4H7xavGoKOrTgw&loading=async"></script>
</body>
</html>
